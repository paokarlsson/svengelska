<main class="shell">
    @switch (screen) {
    @case ('session') {
    @if (block; as chosen) {
    <app-session-view [week]="chosen" (exited)="showHome()" (mapped)="showMap(chosen)" />
    }
    }
    @case ('map') {
    @if (block; as chosen) {
    <app-map-view [block]="chosen" (back)="showHome()" />
    }
    }
    @case ('intro') {
    <app-intro-view (finished)="introDone()" (skipped)="showHome()" />
    }
    @default {
    <app-home-view
        [offerList]="offerList"
        (chosen)="open($event)"
        (mapped)="showMap($event)"
        (intro)="showIntro()" />
    }
    }
</main>
