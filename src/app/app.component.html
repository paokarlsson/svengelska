<main class="shell">
    @switch (screen) {
    @case ('session') {
    @if (block; as chosen) {
    <app-session-view [week]="chosen" (exited)="showHome()" (mapped)="showMap(chosen)" />
    }
    }
    @case ('map') {
    @if (block; as chosen) {
    <app-map-view [block]="chosen" (back)="showHome()" />
    }
    }
    @default {
    <app-home-view (chosen)="open($event)" (mapped)="showMap($event)" />
    }
    }
</main>
