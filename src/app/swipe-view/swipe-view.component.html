<div class="swipe">
    <div class="card-slot" cdkDrag
        [cdkDragDisabled]="locked || thinking" [class.is-instant]="instant"
        (cdkDragMoved)="dragMoved($event)" (cdkDragEnded)="dragEnd($event)">

        <div class="game-card"
            [class.game-card--leaving-right]="leaving === 'right'"
            [class.game-card--leaving-left]="leaving === 'left'"
            [class.game-card--leaving-down]="leaving === 'down'"
            [style.transform]="leaving ? null : 'rotate(' + rotation + 'deg)'"
            tabindex="0"
            role="group"
            [attr.aria-label]="thinking ? 'Vad betyder ' + prompt + '?' : 'Stämmer ' + prompt + ' = ' + shown + '?'"
            (pointerdown)="onPointerDown()"
            (keydown)="onKey($event)">

            <span class="stamp stamp--affirm" [style.opacity]="strength(1)">{{affirmStamp}}</span>
            <span class="stamp stamp--deny" [style.opacity]="strength(-1)">{{denyStamp}}</span>
            <span class="stamp stamp--unsure" [style.opacity]="down">VET EJ</span>

            <p class="word">{{prompt}}</p>

            @if (showsAnswer) {
            <p class="equals" aria-hidden="true">=</p>
            <p class="translation">{{shown}}</p>
            } @else {
            <p class="hint">Tänk på översättningen — tryck sedan på kortet</p>
            }
        </div>
    </div>

    <p class="verdict" role="status" aria-live="polite">
        @if (verdict; as said) {
        <span class="said" [class.said--wrong]="said.tone === 'wrong'"
            [class.said--taught]="said.tone === 'taught'">{{said.text}}</span>
        } @else if (thinking) {
        &nbsp;
        } @else {
        Svep åt sidan — eller ner om du inte vet
        }
    </p>

    @if (thinking) {
    <div class="choices choices--single">
        <button type="button" class="ui-btn ui-btn--primary" (click)="showAnswer()">Visa facit</button>
    </div>
    } @else {
    <div class="choices">
        <button type="button" class="ui-btn ui-btn--secondary choice choice--deny"
            [disabled]="locked" (click)="answer('deny')">
            {{denyLabel}}
        </button>
        <button type="button" class="ui-btn ui-btn--secondary choice choice--affirm"
            [disabled]="locked" (click)="answer('affirm')">
            {{affirmLabel}}
        </button>
        <button type="button" class="ui-btn ui-btn--quiet choice choice--unsure"
            [disabled]="locked" (click)="answer('unsure')">
            Vet ej
        </button>
    </div>
    }
</div>
