name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pages tar emot en deploy i taget, så körningar mot main delar en kö och får
# aldrig avbrytas mitt i en publicering. En pull request bygger bara för att
# validera; den ska ha sin egen grupp, annars ställer den sig i deploy-kön och
# håller upp en riktig publicering. Där är det tvärtom önskvärt att en ny push
# avbryter det föregående bygget.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # angular.json keeps baseHref "/" so ng serve (including via Docker)
      # serves from the root; GitHub Pages hosts the app under /svengelska/ instead.
      - run: npm run build -- --base-href /svengelska/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Jobbets permissions ersätter blocket högst upp i filen i sin helhet, så
    # contents: read måste upprepas här — deploy-pages läser artefaktens
    # metadata från körningen.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
